<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NicoSMP | Bulletin Board</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-logo">Nico<span>SMP</span></div>
        <div class="nav-links">
            <a href="https://nicosmp.net">Home</a>
            <a href="#" class="active">Forums</a>
            <a href="https://store.nicosmp.net">Store</a>
        </div>
    </nav>

    <!-- Forum Layout Container -->
    <div class="forum-container">
        
        <!-- Main Content Feed -->
        <main class="bulletin-feed">
            <h2 class="section-title">📢 Server Announcements</h2>
            <div id="announcements-list">
                <!-- Announcements will be automatically generated here by script.js -->
            </div>
        </main>

        <!-- Sidebar Widgets -->
        <aside class="forum-sidebar">
            <div class="sidebar-box server-status">
                <h3>Server Status</h3>
                <div class="status-indicator">
                    <span class="dot online"></span>
                    <p>IP: <b>play.nicosmp.net</b></p>
                </div>
            </div>

            <div class="sidebar-box discord-widget">
                <h3>Need Support?</h3>
                <p>Want to apply for staff or open a player report? Join our community Discord server.</p>
                <a href="#" class="sidebar-btn">Join Discord</a>
            </div>
        </aside>

    </div>

    <footer>
        <p>&copy; 2026 NicoSMP. Not affiliated with Mojang Studios.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
